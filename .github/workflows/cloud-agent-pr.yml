name: Cloud Agent PR (open as bot)

# A Cursor Cloud Agent's own PR tool opens PRs under the operator's account, which the
# operator then cannot approve (Issue #321). Mac agents open PRs as jarvis-agent-bot328 via
# `gh pr create`; this does the same for Cloud Agent branches (`cursor/*` — Mac branches are
# fix/ feat/ chore/ …): the first push opens a draft PR as the bot, and the agent fills in
# the title/body by branch afterwards (pr-workflow.mdc § Cursor Cloud Agent surface).
#
# A Cloud Agent cannot create issues itself (its `gh` is read-only), so a PR without a
# `Closes #N` also gets a phase-tracking issue here (scripts/phase_state.py init), linked
# outside the agent-managed markers so the agent's body edits keep it (Issue #123 gate).

on:
  push:
    branches: ['cursor/**']

permissions:
  contents: read

concurrency:
  group: cloud-agent-pr-${{ github.ref_name }}

jobs:
  open:
    name: Open PR as jarvis-agent-bot328
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.ADMIN_PAT }}
      BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Open draft PR if none is open
        id: pr
        run: |
          open="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$open" ]; then
            echo "PR #$open already open for $BRANCH"
            echo "number=$open" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          title="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA" --jq '.commit.message | split("\n")[0]')"
          # ManagePullRequest update_pr only rewrites a body inside Cursor's agent-managed
          # markers; without them the agent cannot set the title/body of the bot's PR.
          body="$(printf '<!-- CURSOR_AGENT_PR_BODY_BEGIN -->\nOpened as jarvis-agent-bot328 for Cursor Cloud Agent branch `%s`; the agent replaces this body with the PR template.\n<!-- CURSOR_AGENT_PR_BODY_END -->' "$BRANCH")"
          url="$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" --draft \
            --title "$title" --body "$body")"
          echo "number=${url##*/}" >> "$GITHUB_OUTPUT"

      - name: Link a tracking issue if the PR has none
        env:
          PR: ${{ steps.pr.outputs.number }}
        run: |
          body="$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json body --jq .body)"
          if printf '%s' "$body" | grep -Eiq '\b(close[sd]?|fix(e[sd])?|resolve[sd]?)[[:space:]]+#[0-9]+'; then
            echo "PR #$PR already links its tracking issue"
            exit 0
          fi
          title="$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json title --jq .title)"
          out="$(python3 scripts/phase_state.py init --branch "$BRANCH" --requirement "$title" --kickoff)"
          echo "$out"
          issue="$(printf '%s' "$out" | sed -n 's/^Created issue #\([0-9]*\).*/\1/p')"
          if [ -z "$issue" ]; then
            echo "::error::could not create a tracking issue for PR #$PR"
            exit 1
          fi
          gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --body "$(printf '%s\n\nCloses #%s' "$body" "$issue")"
