name: Operator Console preview

# One read-only preview of the console per PR, reachable from any device:
#   deploy      — Cloud Run service `operator-console-pr<N>` (scale-to-zero) behind
#                 the same Cloud Run direct IAP + Google sign-in allowlist as prod;
#                 sticky PR comment with the URL.
#   screenshots — the PR's build served on the runner against prod BQ (WIF ADC),
#                 captured with capture_evidence.py → sticky PR comment (PR §4 / G5).
#   teardown    — on close, delete the service; the hourly sweep catches any miss.
#
# Pre-PR branch previews: push `preview/<name>` (no PR is opened for that prefix) to deploy
# `operator-console-pv-<slug>-<hash>` (scripts/console_preview.py --branch … --print-service),
# same IAP + read-only setup, URL in the run summary. Keep the name short, `preview/<issue>-<slug>`:
# the WIF subject carries the ref and GCP caps it at 127 bytes. It lives at most 24 h (label
# `expires`, hourly sweep), is deleted when the preview branch is deleted, and when a PR whose
# branch is `<prefix>/<issue>-…` deploys its own preview (label `issue`). Re-push to respawn.
#
# Every preview runs CONSOLE_PREVIEW=1: all non-GET requests are refused in
# middleware.ts and no secrets are mounted, so it can read prod data but not change it.
# Never deploy onto the prod `operator-console` service for previews — a revision's
# env becomes the template the next main deploy inherits (`--update-env-vars`).

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - "apps/operator-console/**"
      - ".github/workflows/operator-console-preview.yml"
  push:
    branches: ['preview/**']
  delete:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

env:
  PROJECT_ID: jarvis-bhaga-prod
  PROJECT_NUMBER: "887772634501"
  REGION: us-central1
  REGISTRY: us-central1-docker.pkg.dev/jarvis-bhaga-prod/jarvis-images
  PROD_SERVICE: operator-console
  PR: ${{ github.event.pull_request.number }}
  AGENT_SA: cursor-cloud-agent@jarvis-bhaga-prod.iam.gserviceaccount.com
  BRANCH_TTL_HOURS: "24"

concurrency:
  group: operator-console-preview-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref) || github.run_id }}
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.action != 'closed' &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    outputs:
      service: ${{ steps.target.outputs.service }}
    env:
      GH_TOKEN: ${{ github.token }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Resolve preview target
        id: target
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if [ -n "$PR" ]; then
            SERVICE="$(python3 scripts/console_preview.py --pr "$PR" --print-service)"
            TAG="pr$PR"
            LABELS="jarvis-preview=operator-console,pr=$PR"
            # Branch previews for this PR's issue (`<prefix>/<issue>-…` ↔ `preview/<issue>-…`) are superseded.
            STALE="$(echo "${HEAD_REF#*/}" | grep -oE '^[0-9]+' || true)"
          else
            # WIF maps the token subject `repo:<owner/repo>:ref:refs/heads/<branch>`; GCP caps it at 127 bytes.
            SUBJECT="repo:$GITHUB_REPOSITORY:ref:$GITHUB_REF"
            if [ "${#SUBJECT}" -gt 127 ]; then
              echo "::error::preview: branch name too long for GCP auth (${#SUBJECT}/127 bytes) — use a short preview/<issue>-<slug>"; exit 1
            fi
            SERVICE="$(python3 scripts/console_preview.py --branch "$GITHUB_REF_NAME" --print-service)"
            TAG="${SERVICE#operator-console-}"
            EXPIRES_AT="$(( $(date +%s) + BRANCH_TTL_HOURS * 3600 ))"
            LABELS="jarvis-preview=operator-console-branch,expires=$EXPIRES_AT"
            ISSUE="$(echo "${GITHUB_REF_NAME#preview/}" | grep -oE '^[0-9]+' || true)"
            [ -n "$ISSUE" ] && LABELS="$LABELS,issue=$ISSUE"
            STALE=""
          fi
          { echo "SERVICE=$SERVICE"; echo "TAG=$TAG"; echo "LABELS=$LABELS"; echo "STALE=$STALE"; echo "EXPIRES_AT=${EXPIRES_AT:-}"; } >> "$GITHUB_ENV"
          echo "service=$SERVICE" >> "$GITHUB_OUTPUT"
          echo "preview: target $SERVICE labels=$LABELS"

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push image
        working-directory: apps/operator-console
        run: |
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          IMAGE="$REGISTRY/operator-console:$TAG-${HEAD_SHA::12}"
          # Each push redeploys this preview while the operator may have it open.
          docker build --build-arg "NEXT_DEPLOYMENT_ID=$TAG-${HEAD_SHA::12}" -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy preview service (IAP, read-only, scale-to-zero)
        run: |
          RUNTIME_SA="$(gcloud run services describe "$PROD_SERVICE" --region "$REGION" --project "$PROJECT_ID" \
            --format='value(spec.template.spec.serviceAccountName)')"
          if [ -z "$RUNTIME_SA" ]; then
            echo "::error::preview: could not read the prod console runtime service account"; exit 1
          fi
          gcloud run deploy "$SERVICE" \
            --image "$IMAGE" \
            --region "$REGION" --project "$PROJECT_ID" \
            --service-account "$RUNTIME_SA" \
            --no-allow-unauthenticated --iap \
            --memory 512Mi --min-instances 0 --max-instances 1 \
            --labels "$LABELS" \
            --set-env-vars "BQ_PROJECT=$PROJECT_ID,BQ_DATASET=bhaga,CONSOLE_PREVIEW=1,IAP_SERVICE_NAME=$SERVICE"

      # Same Google sign-in and allowlist as prod: IAP's service agent may invoke
      # the service, and the IAP accessor policy is copied from prod each deploy, plus
      # the CI identity (preview only) so CI can drive the real preview through IAP.
      - name: Mirror prod IAP access
        run: |
          gcloud run services add-iam-policy-binding "$SERVICE" \
            --region "$REGION" --project "$PROJECT_ID" \
            --member "serviceAccount:service-$PROJECT_NUMBER@gcp-sa-iap.iam.gserviceaccount.com" \
            --role roles/run.invoker --quiet >/dev/null
          gcloud iap web get-iam-policy --resource-type=cloud-run --service="$PROD_SERVICE" \
            --region "$REGION" --project "$PROJECT_ID" --format=json \
            | CI_SA="${{ secrets.WIF_SERVICE_ACCOUNT }}" python3 -c "
          import json, os, sys
          p = json.load(sys.stdin); p.pop('etag', None)
          b = [x for x in p.setdefault('bindings', []) if x['role'] == 'roles/iap.httpsResourceAccessor' and 'condition' not in x]
          if not b:
              b = [{'role': 'roles/iap.httpsResourceAccessor', 'members': []}]; p['bindings'].append(b[0])
          b[0]['members'].append('serviceAccount:' + os.environ['CI_SA'])
          print(json.dumps(p))" > /tmp/iap.json
          python3 -c "import json; p=json.load(open('/tmp/iap.json')); print('iap members copied:', sum(len(b.get('members',[])) for b in p.get('bindings',[])))"
          # Cursor Cloud Agents open previews with an ID token (scripts/cloud_agent_gcp.py id-token);
          # IAP rejects a policy naming a missing SA, so fall back until provisioning has run.
          python3 -c "
          import json; p = json.load(open('/tmp/iap.json'))
          [b for b in p['bindings'] if b['role'] == 'roles/iap.httpsResourceAccessor' and 'condition' not in b][0]['members'].append('serviceAccount:$AGENT_SA')
          json.dump(p, open('/tmp/iap-agent.json', 'w'))"
          set_iap() { gcloud iap web set-iam-policy "$1" --resource-type=cloud-run --service="$SERVICE" \
            --region "$REGION" --project "$PROJECT_ID" --quiet >/dev/null; }
          if set_iap /tmp/iap-agent.json 2>/dev/null; then
            echo "iap: Cursor Cloud Agent SA included"
          else
            echo "iap: $AGENT_SA not provisioned yet (scripts/provision_cloud_agent_identity.sh)"
            set_iap /tmp/iap.json
          fi

      - name: Delete superseded branch previews
        if: env.STALE != ''
        run: |
          gcloud run services list --region "$REGION" --project "$PROJECT_ID" \
            --filter "metadata.labels.jarvis-preview=operator-console-branch AND metadata.labels.issue=$STALE" \
            --format "value(metadata.name)" |
          while read -r name; do
            gcloud run services delete "$name" --region "$REGION" --project "$PROJECT_ID" --quiet
            echo "preview: deleted branch preview $name (issue #$STALE, PR #$PR has its own)"
          done

      - name: Branch preview URL
        if: github.event_name == 'push'
        run: |
          URL="https://$SERVICE-$PROJECT_NUMBER.$REGION.run.app"
          EXPIRES="$(date -u -d "@$EXPIRES_AT" '+%Y-%m-%d %H:%M UTC')"
          printf '### Operator Console branch preview\n**[%s/home](%s/home)** — `%s` commit `%s`\n\nRead-only, prod data, prod IAP allowlist. Deleted at %s or when the branch is deleted; re-push `%s` to respawn.\n' \
            "$URL" "$URL" "$GITHUB_REF_NAME" "${HEAD_SHA::7}" "$EXPIRES" "$GITHUB_REF_NAME" >> "$GITHUB_STEP_SUMMARY"
          echo "preview: deployed $SERVICE url=$URL sha=${HEAD_SHA::7} expires=$EXPIRES"

      - name: Comment preview URL
        if: github.event_name == 'pull_request'
        run: |
          URL="https://$SERVICE-$PROJECT_NUMBER.$REGION.run.app"
          cat > /tmp/body.md <<EOF
          ### Operator Console preview
          **[$URL/home]($URL/home)** — commit \`${HEAD_SHA::7}\`

          Read-only (\`CONSOLE_PREVIEW=1\`): prod data, every save refused. Google sign-in with the same allowlist as prod. Deleted when this PR closes.
          EOF
          python3 scripts/sticky_pr_comment.py --repo "$GITHUB_REPOSITORY" --pr "$PR" \
            --marker operator-console-preview --body-file /tmp/body.md
          echo "preview: deployed $SERVICE url=$URL sha=${HEAD_SHA::7}"

  screenshots:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write        # upload to the evidence-screenshots release
      id-token: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/operator-console/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build console
        working-directory: apps/operator-console
        run: npm ci --no-audit --no-fund && npm run build

      - name: Serve the PR build read-only against prod data
        working-directory: apps/operator-console
        env:
          CONSOLE_PREVIEW: "1"
          BYPASS_IAP_EMAIL: preview-bot@mypalmetto.co
          BQ_PROJECT: ${{ env.PROJECT_ID }}
          BQ_DATASET: bhaga
        run: |
          nohup npx next start -p 3000 > /tmp/next.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -fsS -o /dev/null http://localhost:3000/home && exit 0
            sleep 2
          done
          tail -50 /tmp/next.log; echo "::error::preview: console did not come up on :3000"; exit 1

      # /home and /inventory only: this repo is public, and Payroll / Accounting
      # show names, wages and bank transactions.
      - name: Capture screenshots
        run: |
          pip install --quiet playwright && python3 -m playwright install --with-deps chromium >/dev/null
          python3 apps/operator-console/scripts/capture_evidence.py \
            --path /home --label "pr$PR-home" \
            --path /inventory --label "pr$PR-inventory" | tee /tmp/shots.txt

      - name: Comment screenshots
        run: |
          {
            echo "### Operator Console preview screenshots"
            echo "PR build \`${HEAD_SHA::7}\`, read-only, prod data (rendered on the CI runner)."
            echo
            while IFS= read -r line; do
              label="${line%%: *}"; url="${line#*: }"
              echo "**${label#pr$PR-}**"
              echo
              echo "<img alt=\"$label\" src=\"$url\" width=\"720\" />"
              echo
            done < /tmp/shots.txt
          } > /tmp/body.md
          python3 scripts/sticky_pr_comment.py --repo "$GITHUB_REPOSITORY" --pr "$PR" \
            --marker operator-console-preview-shots --body-file /tmp/body.md

  # Every page, tapped from the phone tab bar's More sheet on the real preview (IAP + Cloud
  # Run), in iPhone WebKit: fails if a tap does not navigate or a page throws. Logs paths and
  # timings only (public repo).
  smoke:
    if: >-
      (github.event_name == 'pull_request' && github.event.action != 'closed') ||
      github.event_name == 'push'
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      SERVICE: ${{ needs.deploy.outputs.service }}
    steps:
      - uses: google-github-actions/auth@v2
        id: idt
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: 887772634501-rtccq8d5foru6kgcqbi3a1n6kmcqn2eu.apps.googleusercontent.com
          id_token_include_email: true
      - name: Mobile nav smoke (iPhone WebKit, through IAP)
        env:
          TOKEN: ${{ steps.idt.outputs.id_token }}
        run: |
          URL="https://$SERVICE-$PROJECT_NUMBER.$REGION.run.app"
          for i in $(seq 1 40); do
            code="$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $TOKEN" "$URL/home")"
            [ "$code" = "200" ] && break
            sleep 15
          done
          [ "$code" = "200" ] || { echo "::error::smoke: IAP did not admit the CI identity (last $code)"; exit 1; }
          pip install --quiet playwright && python3 -m playwright install --with-deps webkit >/dev/null
          cat > /tmp/smoke.py <<'EOF'
          import os, sys, time
          from playwright.sync_api import sync_playwright
          base = os.environ["URL"]
          bad = []
          with sync_playwright() as p:
              b = p.webkit.launch()
              ctx = b.new_context(**p.devices["iPhone 14"], extra_http_headers={"Authorization": "Bearer " + os.environ["TOKEN"]})
              page = ctx.new_page()
              errors = []
              page.on("pageerror", lambda e: errors.append(str(e)[:160]))
              page.goto(base + "/home", wait_until="networkidle", timeout=180000)
              page.get_by_role("button", name="More pages").tap(); page.wait_for_timeout(700)
              hrefs = [h for h in page.get_by_role("dialog").locator("a[href^='/']").evaluate_all("els => els.map(e => e.getAttribute('href'))") if h != "/home"]
              page.keyboard.press("Escape")
              for href in hrefs:
                  page.goto(base + "/home", wait_until="networkidle", timeout=180000)
                  errors.clear()
                  page.get_by_role("button", name="More pages").tap(); page.wait_for_timeout(700)
                  t = time.time(); page.get_by_role("dialog").locator(f"a[href='{href}']").tap()
                  try:
                      page.wait_for_url(f"**{href}**", timeout=30000)
                      page.wait_for_load_state("networkidle", timeout=60000)
                      page.wait_for_timeout(1500)
                      res = f"ok {time.time()-t:.2f}s"
                  except Exception:
                      res = f"STUCK on {page.url[len(base):].split('?')[0]}"
                  if not res.startswith("ok") or errors:
                      bad.append(href)
                  print(f"home -> {href}: {res}" + (f" | page errors: {errors}" if errors else ""))
              b.close()
          sys.exit(f"smoke: failed for {bad}" if bad else 0)
          EOF
          URL="$URL" python3 /tmp/smoke.py

  teardown:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      SERVICE: operator-console-pr${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Delete preview service
        run: |
          if gcloud run services describe "$SERVICE" --region "$REGION" --project "$PROJECT_ID" >/dev/null 2>&1; then
            gcloud run services delete "$SERVICE" --region "$REGION" --project "$PROJECT_ID" --quiet
            echo "preview: deleted $SERVICE"
          else
            echo "preview: $SERVICE not found (never deployed or already deleted)"
          fi
          printf '### Operator Console preview\nPR closed — preview service `%s` deleted.\n' "$SERVICE" > /tmp/body.md
          python3 scripts/sticky_pr_comment.py --repo "$GITHUB_REPOSITORY" --pr "$PR" \
            --marker operator-console-preview --body-file /tmp/body.md

  branch-teardown:
    if: >-
      github.event_name == 'delete' &&
      github.event.ref_type == 'branch' &&
      startsWith(github.event.ref, 'preview/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Delete branch preview service
        env:
          BRANCH: ${{ github.event.ref }}
        run: |
          SERVICE="$(python3 scripts/console_preview.py --branch "$BRANCH" --print-service)"
          if gcloud run services describe "$SERVICE" --region "$REGION" --project "$PROJECT_ID" >/dev/null 2>&1; then
            gcloud run services delete "$SERVICE" --region "$REGION" --project "$PROJECT_ID" --quiet
            echo "preview: deleted $SERVICE ($BRANCH deleted)"
          else
            echo "preview: $SERVICE not found"
          fi

  # Safety net for a missed `closed` event: delete preview services whose PR is no longer open,
  # and branch previews past their `expires` label.
  sweep:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Delete orphaned previews
        run: |
          gcloud run services list --region "$REGION" --project "$PROJECT_ID" \
            --filter "metadata.labels.jarvis-preview=operator-console" \
            --format "value(metadata.name,metadata.labels.pr)" |
          while read -r name pr; do
            state="$(gh pr view "$pr" --repo "$GITHUB_REPOSITORY" --json state -q .state 2>/dev/null || echo UNKNOWN)"
            if [ "$state" = "OPEN" ]; then
              echo "sweep: keep $name (PR #$pr open)"
            elif [ "$state" = "UNKNOWN" ]; then
              echo "::warning::sweep: could not read PR #$pr state — keeping $name"
            else
              gcloud run services delete "$name" --region "$REGION" --project "$PROJECT_ID" --quiet
              echo "sweep: deleted $name (PR #$pr $state)"
            fi
          done

      - name: Delete expired branch previews
        run: |
          now="$(date +%s)"
          gcloud run services list --region "$REGION" --project "$PROJECT_ID" \
            --filter "metadata.labels.jarvis-preview=operator-console-branch" \
            --format "value(metadata.name,metadata.labels.expires)" |
          while read -r name expires; do
            if [ -n "$expires" ] && [ "$expires" -gt "$now" ]; then
              echo "sweep: keep $name ($(( (expires - now) / 60 )) min left)"
            else
              gcloud run services delete "$name" --region "$REGION" --project "$PROJECT_ID" --quiet
              echo "sweep: deleted $name (expired)"
            fi
          done
