name: Prod ops

# Prod operations for Cursor Cloud Agents (scripts/prod_ops.py).
# `/prod-ops …` comment (owner/collaborators) → guard plans the exact commands, sorts
# them with prod_ops.tier() and replies with them → `run` executes with the CI workload
# identity: auto ops at once in Environment `prod-auto` (no reviewer), everything else
# after the operator approves in Environment `prod` (web or GitHub mobile).
#
# A gated op is refused unless `prod` requires a reviewer: GitHub silently
# auto-creates a referenced environment WITHOUT protection, which would turn it
# into an unreviewed prod write.
#
# issue_comment resolves from main (post-merge only); the pull_request self-test
# runs the guard and plans canned requests without executing anything.

on:
  issue_comment:
    types: [created]
  pull_request:
    paths:
      - "scripts/prod_ops.py"
      - ".github/workflows/prod-ops.yml"

permissions:
  contents: read
  id-token: write
  issues: write
  pull-requests: write

jobs:
  guard:
    if: >-
      (github.event_name == 'issue_comment' &&
       startsWith(github.event.comment.body, '/prod-ops') &&
       (contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) ||
        github.event.comment.user.login == 'cursor[bot]')) ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      head_sha: ${{ steps.head.outputs.head_sha }}
      tier: ${{ steps.plan.outputs.tier }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: PR head
        id: head
        if: github.event_name == 'issue_comment' && github.event.issue.pull_request
        env:
          ISSUE: ${{ github.event.issue.number }}
        run: echo "head_sha=$(gh pr view "$ISSUE" --repo "$GITHUB_REPOSITORY" --json headRefOid -q .headRefOid)" >> "$GITHUB_OUTPUT"

      # tier() reads the PR's migrations as data; the guard never runs PR code.
      - name: Check out PR head
        if: steps.head.outputs.head_sha != ''
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.head.outputs.head_sha }}
          path: pr-head

      # Creating/protecting an environment needs repo-admin (owner-only), so the
      # operator sets the reviewer once; until then gated comments fail closed and PRs warn.
      - name: Is environment `prod` protected
        id: protected
        run: |
          protected() {
            curl -fsS "https://api.github.com/repos/$GITHUB_REPOSITORY/environments/prod" 2>/dev/null | python3 -c '
          import json, sys
          d = json.load(sys.stdin)
          print("yes" if any(r.get("type") == "required_reviewers" and r.get("reviewers") for r in d.get("protection_rules", [])) else "no")
          ' 2>/dev/null || echo missing
          }
          STATE="$(protected)"
          echo "state=$STATE" >> "$GITHUB_OUTPUT"
          [ "$STATE" = "yes" ] || echo "::warning::prod-ops: GitHub Environment 'prod' is '$STATE' — gated ops will be refused"

      - name: Plan
        id: plan
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          ISSUE: ${{ github.event.issue.number }}
          IS_PR: ${{ github.event.issue.pull_request != null }}
          PROD_STATE: ${{ steps.protected.outputs.state }}
          HEAD_SHA: ${{ steps.head.outputs.head_sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            for body in "/prod-ops whoami" "/prod-ops console-env set CONSOLE_EXAMPLE_FLAG=1" \
                        "/prod-ops run-job bhaga-daily-refresh REFRESH_DATE=2026-10-10" "/prod-ops apply-migrations" \
                        "/prod-ops console-env set CONSOLE_PREVIEW=1"; do
              COMMENT_BODY="$body" python3 scripts/prod_ops.py plan || true
            done
            for body in "/prod-ops run-job-pr bhaga-daily-refresh BHAGA_SCHEDULE_DRY_RUN=1" \
                        "/prod-ops run-job-pr bhaga-daily-refresh BHAGA_ADP_SCHEDULE_WRITE=apply BHAGA_SCHEDULE_DRY_RUN=1"; do
              COMMENT_BODY="$body" IS_PR=true ISSUE=1 python3 scripts/prod_ops.py plan || true
            done
            exit 0
          fi
          [ -n "$HEAD_SHA" ] && export PROD_OPS_CODE_ROOT="$GITHUB_WORKSPACE/pr-head"
          set +e
          PLAN="$(python3 scripts/prod_ops.py plan)"; RC=$?
          set -e
          echo "$PLAN"
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ "$RC" = "0" ]; then
            read -r TIER WHY < <(printf '%s' "$PLAN" | python3 -c 'import json,sys; p=json.load(sys.stdin); print(p["tier"], p["why"])')
            CMDS="$(printf '%s' "$PLAN" | python3 -c 'import json,sys; print("\n".join(json.load(sys.stdin)["commands"]))')"
            echo "tier=$TIER" >> "$GITHUB_OUTPUT"
            if [ "$TIER" = "auto" ]; then
              HEAD="**prod-ops** running now, no approval needed ($WHY) — [run]($RUN_URL):"
            elif [ "$PROD_STATE" = "yes" ]; then
              HEAD="**prod-ops** awaiting operator approval ($WHY) — [review deployment]($RUN_URL):"
            else
              HEAD="\`prod-ops: GitHub Environment 'prod' is '$PROD_STATE' (needs a required reviewer). Settings → Environments → 'prod' → Required reviewers → add the operator.\` Refusing:"
              RC=1
            fi
            BODY="$HEAD"$'\n```\n'"$CMDS"$'\n```'
          else
            BODY="\`$PLAN\`"
          fi
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE/comments" -X POST -f body="$BODY" >/dev/null
          [ "$RC" = "0" ]

  run:
    needs: guard
    if: github.event_name == 'issue_comment'
    runs-on: ubuntu-latest
    # Referencing `prod-auto` creates it on first use, unprotected by design: only tier() "auto" ops land there.
    environment: ${{ needs.guard.outputs.tier == 'auto' && 'prod-auto' || 'prod' }}
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE: ${{ github.event.issue.number }}
      HEAD_SHA: ${{ needs.guard.outputs.head_sha }}
      PROD_OPS_TIER: ${{ needs.guard.outputs.tier }}
    steps:
      - uses: actions/checkout@v4

      - name: Check out PR head for migrations
        if: needs.guard.outputs.head_sha != ''
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.guard.outputs.head_sha }}
          path: pr-head

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install --quiet -r requirements.txt

      - name: Run
        id: run
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          [ -n "$HEAD_SHA" ] && export PROD_OPS_CODE_ROOT="$GITHUB_WORKSPACE/pr-head"
          set +e
          python3 scripts/prod_ops.py run | tee /tmp/out.txt
          RC=${PIPESTATUS[0]}
          echo "rc=$RC" >> "$GITHUB_OUTPUT"
          exit "$RC"

      - name: Reply
        if: always()
        run: |
          LAST="$(grep '^prod-ops: ' /tmp/out.txt 2>/dev/null | tail -1)"
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE/comments" -X POST \
            -f body="\`${LAST:-prod-ops: no result}\` — [run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)" >/dev/null
