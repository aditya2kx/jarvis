name: Prod read

# Read-only prod access for Cursor Cloud Agents (no GCP identity on their VMs).
# A `/prod-read …` comment from the repo owner/collaborators or cursor[bot] (the Cloud Agent
# PR-comment tool, same as prod-ops.yml) runs
# scripts/prod_read.py with the CI workload identity; the result is encrypted to
# the public key in the comment and uploaded as an artifact. This repo is public:
# nothing but a one-line summary is ever printed or commented.
#
# issue_comment resolves from main, so the comment path only works once merged;
# the pull_request self-test proves WIF + query + encryption pre-merge.

on:
  issue_comment:
    types: [created]
  pull_request:
    paths:
      - "scripts/prod_read.py"
      - ".github/workflows/prod-read.yml"

permissions:
  contents: read
  id-token: write
  issues: write
  pull-requests: write

jobs:
  read:
    if: >-
      github.event_name == 'issue_comment' &&
      startsWith(github.event.comment.body, '/prod-read') &&
      (contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) ||
       github.event.comment.user.login == 'cursor[bot]')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      COMMENT_ID: ${{ github.event.comment.id }}
      ISSUE: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install --quiet -r requirements.txt

      - name: Run request
        id: run
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set +e
          SUMMARY="$(python3 scripts/prod_read.py serve-comment --out result.enc.json)"
          echo "rc=$?" >> "$GITHUB_OUTPUT"
          echo "$SUMMARY"
          echo "summary=$SUMMARY" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        if: steps.run.outputs.rc == '0'
        with:
          name: prod-read-${{ github.event.comment.id }}
          path: result.enc.json
          retention-days: 3

      - name: Reply
        if: always()
        env:
          SUMMARY: ${{ steps.run.outputs.summary }}
          RC: ${{ steps.run.outputs.rc }}
        run: |
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ "$RC" = "0" ]; then
            NEXT="Encrypted result: artifact \`prod-read-$COMMENT_ID\` on [run $GITHUB_RUN_ID]($RUN_URL) — \`gh run download $GITHUB_RUN_ID -n prod-read-$COMMENT_ID\` then \`python3 scripts/prod_read.py decrypt result.enc.json\`."
          else
            NEXT="No result. [Run log]($RUN_URL)."
          fi
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE/comments" -X POST \
            -f body="\`${SUMMARY:-prod-read: failed before running}\` (reply to comment $COMMENT_ID). $NEXT" >/dev/null
          [ "$RC" = "0" ]

  self-test:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install --quiet -r requirements.txt

      - name: Self-test (status + bq, encrypted round-trip, summary only)
        run: python3 scripts/prod_read.py self-test
