server {
  listen ${PORT};
  root /usr/share/nginx/html;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
  client_max_body_size 10m;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header X-Robots-Tag noindex always;

  # API calls go through this service on the same origin. On the Google-gated service, Google's
  # signed identity header rides along and the Tasks API verifies it itself.
  location /v1/ {
    resolver 8.8.8.8 valid=60s;
    set $api ${API_HOST};
    proxy_pass https://$api;
    proxy_set_header Host $api;
    proxy_set_header X-Signin-Assertion $http_x_goog_iap_jwt_assertion;
    proxy_ssl_server_name on;
    proxy_ssl_name $api;
    proxy_read_timeout 120s;
  }

  # "Sign in with Google": a hop through the Google-gated service, which sends the browser back here.
  location = /signin {
    return 302 ${SIGNIN_URL}/v1/handoff;
  }

  # One link for everyone: the app's pages are only served on HOME_HOST; other hosts send people there.
  # Hashed build files never change; the shell and the worker must always be fresh.
  location /assets/ {
    if ($host != "${HOME_HOST}") {
      return 301 https://${HOME_HOST}$request_uri;
    }
    expires 1y;  # `expires`, not add_header: a location-level add_header would drop the headers above
  }
  location / {
    if ($host != "${HOME_HOST}") {
      return 301 https://${HOME_HOST}$request_uri;
    }
    expires -1;
    try_files $uri /index.html;
  }
}
