server {
  listen ${PORT};
  root /usr/share/nginx/html;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
  client_max_body_size 10m;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header X-Robots-Tag noindex always;

  # This service sits behind Google sign-in. API calls go through it on the same origin, so
  # Google's signed identity header reaches the Tasks API, which verifies it itself.
  location /v1/ {
    resolver 8.8.8.8 valid=60s;
    set $api ${API_HOST};
    proxy_pass https://$api;
    proxy_set_header Host $api;
    proxy_set_header X-Signin-Assertion $http_x_goog_iap_jwt_assertion;
    proxy_ssl_server_name on;
    proxy_ssl_name $api;
    proxy_read_timeout 120s;
  }

  # Hashed build files never change; the shell and the worker must always be fresh.
  location /assets/ {
    expires 1y;  # `expires`, not add_header: a location-level add_header would drop the headers above
  }
  location / {
    expires -1;
    try_files $uri /index.html;
  }
}
